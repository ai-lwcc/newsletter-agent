<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #222;">

    {% if campaign.heyzine_url and campaign.pdf_cover_image %}
        <p>
            <a href="{{ campaign.heyzine_url }}">
                <img
                    src="cid:{{ cover_cid }}"
                    alt="{{ campaign.title }}"
                    style="max-width: 100%; width: 500px; border: 1px solid #ddd;"
                >
            </a>
        </p>
    {% endif %}

    <div>
        {{ campaign.email_body|linebreaks }}
    </div>

</body>
</html>
