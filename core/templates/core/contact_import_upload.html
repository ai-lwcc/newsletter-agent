{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Import Contacts</title>
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body>

<div class="container">

    <p>
        <a href="{% url 'dashboard' %}">
            ← Back to Dashboard
        </a>
    </p>

    <div class="card">
        <h1>Import Contacts</h1>

        <p>
            Upload an Excel file to preview contact changes before importing.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <p>
                <input
                    type="file"
                    name="uploaded_file"
                    accept=".xlsx"
                    required
                >
            </p>

            <button class="button safe" type="submit">
                Upload and Preview
            </button>
        </form>
    </div>

</div>

</body>
</html>
